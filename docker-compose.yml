services:
  backend:
    build:
      context: ./backend
    ports:
      - "${NOTARYVERIFY_BACKEND_PORT:-8000}:8000"
    environment:
      NOTARYVERIFY_DATA_DIR: ${NOTARYVERIFY_DATA_DIR:-/app/data}
      NOTARYVERIFY_DATABASE_URL: ${NOTARYVERIFY_DATABASE_URL:-}
      NOTARYVERIFY_BOOTSTRAP_OPERATOR_EMAIL: ${NOTARYVERIFY_BOOTSTRAP_OPERATOR_EMAIL:-}
      NOTARYVERIFY_BOOTSTRAP_OPERATOR_PASSWORD: ${NOTARYVERIFY_BOOTSTRAP_OPERATOR_PASSWORD:-}
      NOTARYVERIFY_BOOTSTRAP_ADMIN_EMAIL: ${NOTARYVERIFY_BOOTSTRAP_ADMIN_EMAIL:-}
      NOTARYVERIFY_BOOTSTRAP_ADMIN_PASSWORD: ${NOTARYVERIFY_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - notaryverify-data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "${NOTARYVERIFY_FRONTEND_PORT:-5500}:5500"
    depends_on:
      - backend

volumes:
  notaryverify-data:
